[package]
name = "http_client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "gpui_http_client_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit = { path = "../../crates/kit" }
console_error_panic_hook = "0.1"
js-sys = "0.3"
log = "0.4"
percent-encoding = "2.3"
ropey = "=2.0.0-beta.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wuff = { version = "=0.2.9", default-features = false, features = ["brotli"] }
