[package]
name = "json5-web-editor"
version = "0.1.3"
publish = false
edition = "2024"
license = "Apache-2.0"

[lib]
name = "gpui_json5_editor_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit = { path = "../../crates/kit" }
ropey = "=2.0.0-beta.1"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tracing-wasm = "0.2"
wasm-bindgen = "0.2"
wuff = { version = "=0.2.9", default-features = false, features = ["brotli"] }
