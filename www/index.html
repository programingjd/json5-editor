<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>JSON5 Editor</title>
    <style>
      :root {
        color-scheme: light;
        background: #fff;
      }

      :root.dark {
        color-scheme: dark;
        background: #0a0a0a;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body > canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      #error {
        position: fixed;
        inset: 0;
        display: none;
        place-content: center;
        padding: 2rem;
        color: #b91c1c;
        background: Canvas;
        font: 14px/1.5 var(--ui-font-family, Inter, sans-serif);
        white-space: pre-wrap;
      }
    </style>
    <script src="/initial-theme.js"></script>
  </head>
  <body>
    <div id="error"></div>
    <div id="parser-busy" role="status" aria-live="off" hidden>
      <span class="processing-spinner" aria-hidden="true"></span>
      <span class="visually-hidden">Parsing document</span>
    </div>
    <section id="document-loading" role="dialog" aria-modal="true" aria-labelledby="loading-title" tabindex="-1" hidden>
      <div class="loading-panel">
        <div class="loading-heading">
          <span class="processing-spinner" aria-hidden="true"></span>
          <h1 id="loading-title"></h1>
        </div>
        <div id="loading-progress" hidden>
          <p id="loading-size"></p>
          <div id="loading-progress-bar" role="progressbar" aria-label="File loading" aria-valuemin="0">
            <div class="loading-progress-fill"></div>
          </div>
        </div>
        <div class="loading-actions">
          <button id="abort-loading" type="button">Abort</button>
        </div>
      </div>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
