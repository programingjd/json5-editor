[package]
name = "gpui-component"
version = "0.7.1"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/longbridge/gpui-kit"
description = "Editor-owned subset of gpui-component for JSON5 Editor"

[lib]
doctest = false

[features]
default = []
test-support = ["gpui/test-support"]
inspector = ["gpui/inspector", "gpui_macros/inspector"]
tree-sitter = []
speech = []

[dependencies]
regex = "1"
anyhow = { version = "1" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.8" }
gpui-base = { path = "../base", version = "0.7.1" }
gpui-kit-assets = { path = "../assets", version = "0.7.1" }
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
rust-i18n = { version = "4.2.0" }
schemars = { version = "1" }
serde = { version = "1.0.219", features = ["derive"] }
serde_repr = "0.1"
serde_json = { version = "1" }
smallvec = { version = "1" }
tracing = { version = "0.1.41" }
markdown = { version = "1.0.0", features = ["serde"] }
once_cell = "1.19.0"
paste = "1"
lsp-types = { version = "0.97.0", features = ["proposed"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol = { version = "2" }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=21.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gpui-fast"))'] }
