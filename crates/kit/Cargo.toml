[package]
name = "gpui-kit"
version = "0.7.1"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/longbridge/gpui-kit"
description = "Editor-owned GPUI facade for JSON5 Editor"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-base = { path = "../base" }
gpui-component = { path = "../component" }
gpui-kit-assets = { path = "../assets" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { package = "gpui-pre-web", version = "=0.3.8" }
