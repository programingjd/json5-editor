[package]
name = "gpui-kit-assets"
version = "0.9.1"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/longbridge/gpui-kit"
description = "Editor-owned subset of gpui-kit-assets for JSON5 Editor"
links = "gpui-kit-default-icons"

[lib]
doctest = false

[features]
default = []
test-support = ["gpui/test-support"]

[dependencies]
anyhow = { version = "1.0" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
log = { version = "0.4" }
reqwest = { package = "gpui-pre-reqwest", version = "0.12", default-features = false }
wasm-bindgen-futures = "0.4"
