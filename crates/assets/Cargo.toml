[package]
name = "gpui-kit-assets"
version = "0.7.1"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/longbridge/gpui-kit"
description = "Editor-owned subset of gpui-kit-assets for JSON5 Editor"
links = "gpui-kit-default-icons"

[lib]
doctest = false

[features]
default = []
test-support = ["gpui/test-support"]

[dependencies]
anyhow = { version = "1" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
log = { version = "0.4" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { package = "gpui-pre-reqwest", version = "=0.12.15", default-features = false, features = ["charset", "http2", "macos-system-configuration", "multipart", "rustls-tls-native-roots", "socks", "stream"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gpui-fast"))'] }
