[package]
name = "gpui-json5-processor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.121"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "=0.27.1"
tree-sitter-json5-orchard = { path = "../grammar" }
