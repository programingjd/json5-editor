[workspace]

[package]
name = "http-client-proxy"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
bytes = "1"
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "gzip", "brotli", "deflate", "zstd"] }
salvo = { version = "1.2.1", default-features = false, features = ["server", "http1", "serve-static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

