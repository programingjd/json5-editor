[workspace]
resolver = "2"
members = [
    "apps/editor",
    "apps/http_client",
    "worker",
    "crates/base",
    "crates/component",
    "crates/assets",
    "crates/kit",
]
default-members = ["apps/editor"]

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
json5-web-editor = { opt-level = 2 }
gpui-json5-processor = { opt-level = 2 }
gpui-base = { opt-level = 2 }
gpui-component = { opt-level = 2 }
ropey = { opt-level = 3 }
tree-sitter = { opt-level = 3 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "debuginfo"
panic = "abort"

