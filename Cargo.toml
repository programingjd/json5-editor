[workspace]
resolver = "2"
members = ["worker", "crates/base", "crates/component", "crates/assets", "crates/kit"]
default-members = ["."]

[package]
name = "json5-web-editor"
version = "0.1.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[lib]
name = "gpui_json5_editor_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui-kit = { path = "crates/kit" }
ropey = "=2.0.0-beta.1"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing-wasm = "0.2"
wasm-bindgen = "=0.2.121"
wuff = { version = "=0.2.9", default-features = false, features = ["brotli"] }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
json5-web-editor = { opt-level = 2 }
gpui-json5-processor = { opt-level = 2 }
gpui-base = { opt-level = 2 }
gpui-component = { opt-level = 2 }
ropey = { opt-level = 3 }
tree-sitter = { opt-level = 3 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "debuginfo"
panic = "abort"

